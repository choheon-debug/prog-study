<html lang="ko">
<head>

<style>
:root{
  --bg:#EAEAEA; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --acc:#4f46e5; --acc-d:#3730a3; --acc-l:#e0e7ff; --blue:#3b82f6; --orange:#f97316; --purple:#a855f7; --green:#22c55e; --red:#ef4444;
  --shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -2px rgb(0 0 0 / .05);
  --mono:ui-monospace,Menlo,Consolas,"D2Coding","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:36rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 100px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
header{text-align:center;position:relative;padding:4px 50px}
header h1{margin:0;font-size:1.45rem;font-weight:800}
header p{margin:3px 0 0;font-size:.84rem;color:var(--muted)}
.gear{position:absolute;right:0;top:2px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .08);font-size:1.15rem}
.back{position:absolute;left:0;top:2px;height:42px;border:0;border-radius:21px;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .08);padding:0 12px;font-weight:800;font-size:.9rem}
.card{background:var(--card);border-radius:1.5rem;box-shadow:var(--shadow);padding:16px}
.t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px;font-weight:800;font-size:1.05rem}
.t span{font-weight:400;font-size:.8rem;color:var(--muted)}
.sm{font-size:.84rem;color:var(--muted)}
.btn{border:0;border-radius:14px;font-weight:800;color:#fff;padding:14px 12px;font-size:1.02rem;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.3}
.btn small{font-weight:400;font-size:.8rem;opacity:.95}
.btn:disabled{opacity:.45}
.b-acc{background:var(--acc)}.b-blue{background:var(--blue)}.b-orange{background:var(--orange)}.b-purple{background:var(--purple)}.b-green{background:var(--green)}.b-gray{background:#eef0f3;color:var(--ink)}.b-red{background:#fff;color:#dc2626;box-shadow:inset 0 0 0 1px #fecaca}.b-kakao{background:#fee500;color:#3c1e1e}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mt{margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:16px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:11px;border-radius:12px;font-weight:800;color:var(--muted);font-size:1rem}
.seg button.on{background:var(--acc);color:#fff}
.bar{height:11px;background:#eef0f3;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green)}
.subj{display:grid;grid-template-columns:7.8rem minmax(0,1fr) 3rem;gap:8px;align-items:center;padding:6px 0 0}
.subj b{font-size:.9rem;white-space:nowrap}.subj .pct{text-align:right;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:800;background:#eef0f3;color:var(--muted)}
.chip.on{background:var(--acc);color:#fff}
.tag{display:inline-block;font-size:.74rem;font-weight:800;border-radius:7px;padding:2px 8px;background:var(--acc-l);color:var(--acc-d)}
.qtext{font-size:1.1rem;font-weight:800;line-height:1.55;margin:10px 0 4px;white-space:pre-line}
pre.code{background:#1e293b;color:#e2e8f0;border-radius:12px;padding:11px 12px;font:13.5px/1.55 var(--mono);margin:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre;tab-size:4}
pre.code .k{color:#93c5fd}pre.code .s{color:#86efac}pre.code .n{color:#fca5a5}pre.code .c{color:#94a3b8}
.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:1rem;margin-top:9px;display:flex;gap:10px;align-items:center;line-height:1.45}
.opt b{width:28px;height:28px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;font-size:.88rem;flex:none}
.opt span{white-space:pre-wrap;word-break:break-word}
.opt.mono span{font-family:var(--mono);font-size:.9rem}
.opt.pick{border-color:var(--blue);background:#eff6ff}.opt.pick b{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:#f0fdf4}.opt.ok b{background:var(--green);color:#fff}
.opt.no{border-color:var(--red);background:#fef2f2}.opt.no b{background:var(--red);color:#fff}
.exp{background:#eef2ff;border:1px solid #c7d2fe;border-radius:14px;padding:12px;line-height:1.65;margin-top:12px}
.exp.bad{background:#fff7ed;border-color:#fed7aa}
.exp code,.ans{font-family:var(--mono);font-size:.9rem;background:#fff;border-radius:6px;padding:1px 5px}
.prog{display:flex;gap:3px;margin-top:4px}.prog i{flex:1;height:6px;border-radius:3px;background:#e5e7eb}.prog i.r{background:var(--green)}.prog i.p{background:#facc15}.prog i.w{background:var(--red)}.prog i.c{background:var(--acc-d)}
.icon{border:0;background:#eef0f3;border-radius:12px;min-width:44px;height:40px;font-size:1.05rem;padding:0 10px;font-weight:800}
.icon.on{background:#fef3c7}
textarea.answer{width:100%;min-height:90px;border:2px solid #c7d2fe;border-radius:12px;padding:10px;font:14px/1.5 var(--mono);background:#fff;resize:vertical}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.nav nav{pointer-events:auto;max-width:36rem;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 4px 18px rgb(0 0 0 / .14);display:grid;grid-template-columns:repeat(5,1fr);padding:5px}
.nav button{border:0;background:none;border-radius:14px;padding:5px 0;font-size:.74rem;white-space:nowrap;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center}

.nav button.on{background:var(--acc-l);color:var(--acc-d)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:12px;padding:11px 16px;font-size:.92rem;z-index:90;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:60;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
.sheet{background:#fff;border-radius:20px;width:100%;max-width:36rem;max-height:92dvh;display:flex;flex-direction:column;padding:14px 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:1.08rem;color:var(--acc-d)}
.x{border:0;background:none;font-size:1.9rem;line-height:1;color:var(--muted)}
.sbody{overflow-y:auto;overflow-x:hidden;flex:1}
.lab{display:block;font-size:.86rem;font-weight:800;margin:12px 0 5px}
.inp{width:100%;min-width:0;padding:11px 12px;border:1px solid #d1d5db;border-radius:12px;font-size:1rem;background:#fff}
input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:48px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
textarea.inp{min-height:5rem;resize:vertical;line-height:1.5}
/* 교재 */
.sec{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;display:flex;gap:10px;align-items:center}
.sec:first-of-type{border-top:0}
.sec .n{width:34px;height:34px;border-radius:10px;background:var(--acc-l);color:var(--acc-d);font-weight:800;display:grid;place-items:center;flex:none;font-size:.88rem}
.sec .n.done{background:var(--green);color:#fff}
.sec b{flex:1;font-size:.96rem;line-height:1.4}
.book{line-height:1.75;font-size:1.02rem}
.book h2{font-size:1.12rem;margin:22px 0 6px;color:var(--acc-d)}
.book h2:first-child{margin-top:0}
.book h3{font-size:1.03rem;margin:16px 0 4px}
.book h4{font-size:.97rem;margin:10px 0 2px;color:#374151}
.book p,.book .li{margin:4px 0;padding:2px 4px;border-radius:8px}
.book .li{padding-left:1.4em;text-indent:-1.1em}
.book .bx{border-radius:14px;padding:10px 12px;margin:10px 0;font-size:.97rem}
.bx .k{display:inline-block;font-size:.74rem;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;color:#fff;text-indent:0}
.bx.시험{background:#fef2f2;border:1px solid #fecaca}.bx.시험 .k{background:#ef4444}
.bx.쉬운{background:#eff6ff;border:1px solid #bfdbfe}.bx.쉬운 .k{background:#3b82f6}
.bx.실제{background:#f0fdf4;border:1px solid #bbf7d0}.bx.실제 .k{background:#16a34a}
.bx.예제,.bx.해설,.bx.모범답안,.bx.정답·해설{background:#faf5ff;border:1px solid #e9d5ff}.bx.예제 .k,.bx.해설 .k,.bx.모범답안 .k,.bx.정답·해설 .k{background:#9333ea}
.reading{background:#fef08a!important;box-shadow:0 0 0 3px #fef08a}
pre.code.reading{outline:3px solid #fde047}
.player{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:25;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.player div{pointer-events:auto;background:var(--acc-d);color:#fff;border-radius:16px;box-shadow:0 6px 18px rgb(0 0 0 / .25);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;max-width:34rem;width:100%}
.player span{flex:1;font-size:.88rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.player button{border:0;border-radius:12px;background:#fff;color:var(--acc-d);font-weight:800;padding:9px 12px;flex:none}
/* 카드 */
.flash{min-height:270px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .front{font-size:1.2rem;font-weight:800;line-height:1.5;margin:8px 0}
.flash .lines{text-align:left;margin-top:10px}
.flash .lines div{background:#f9fafb;border-radius:12px;padding:9px 12px;margin-top:6px;line-height:1.55}
.big{font-size:3rem;font-weight:800;line-height:1.05}
.pass{display:inline-block;color:#fff;font-weight:800;border-radius:999px;padding:5px 14px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.grid.g12{grid-template-columns:repeat(6,1fr)}
.grid button{border:0;border-radius:6px;padding:7px 0;font-size:.76rem;font-weight:800;background:#eef0f3;color:var(--muted)}
.grid button.d{background:var(--acc-l);color:var(--acc-d)}.grid button.cur{outline:2px solid var(--acc-d)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.hint{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:10px 12px;font-size:.88rem;line-height:1.55}
.guide{background:linear-gradient(135deg,#eef2ff,#fff);border:1px solid #c7d2fe}
.step{display:flex;gap:10px;align-items:center;border-top:1px solid #e0e7ff;padding:9px 0}
.step:first-of-type{border-top:0}
.step .no{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:.82rem}
.step .no.ok{background:var(--green)}
.step .main{flex:1;min-width:0;font-size:.95rem;line-height:1.4}
.step button{border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:800;padding:8px 11px;font-size:.84rem;flex:none}
.row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.now{background:#eef2ff;border-radius:14px;padding:14px;min-height:120px;line-height:1.65;font-size:1.05rem;margin-top:10px;white-space:pre-line}
/* 마인드맵 */
.mmsearch{display:flex;gap:6px}.mmsearch .inp{flex:1}
.mhit{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;line-height:1.45;font-size:.95rem}
.mhit:first-child{border-top:0}.mhit mark{background:#fef08a;border-radius:4px;padding:0 2px}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#dfe3e8;border-radius:14px;padding:4px}
.tabs3 button{border:0;border-radius:11px;padding:9px 2px;font-weight:800;font-size:.86rem;background:none;color:var(--muted)}
.tabs3 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.mtree{font-size:.98rem;line-height:1.45;padding:10px 8px}
.mnd{display:flex;align-items:flex-start;gap:6px;width:100%;text-align:left;border:0;border-radius:10px;padding:8px 9px;margin:3px 0;font:inherit;color:inherit}
.mnd i{font-style:normal;width:14px;flex:none;color:var(--muted);font-size:.72rem;padding-top:4px}
.mnd.l0{background:#ede9fe;color:#5b21b6;font-weight:800}
.mnd.l1{background:#dbeafe;color:#1e40af;font-weight:800}
.mnd.l2{background:#ccfbf1;color:#115e59;font-weight:700}
.mnd.l3{background:#fef3c7;color:#92400e;font-weight:700}
.mnd.lf{background:#fff;border:1px solid var(--line);padding:7px 9px}
.mn{font-style:normal;font-size:.72rem;color:#0f766e;flex:none;padding-top:3px}
.mnd.reading,.mnd.mflash{background:#fef08a!important}
.mk{position:relative;margin-left:12px;padding-left:12px}
.mk>.mi{position:relative;padding:.5px 0}
.mk>.mi::before{content:"";position:absolute;left:-12px;top:0;bottom:0;border-left:2px solid #b6bcc6}
.mk>.mi:last-child::before{bottom:auto;height:22px}
.mk>.mi::after{content:"";position:absolute;left:-12px;top:22px;width:10px;border-top:2px solid #b6bcc6}
.mmap{background:#fff;border-radius:1.4rem;box-shadow:var(--shadow);overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;font-size:.78rem;line-height:1.3;max-height:70dvh}
.mb{display:flex;align-items:center}
.mx{flex:none;padding:5px 8px;border-radius:6px;font-weight:800;white-space:nowrap;border:0;font:inherit;font-weight:800;text-align:left}
.mhl{flex:none;width:12px;border-top:1.5px solid var(--c)}
.mks{display:flex;flex-direction:column}
.mkk{position:relative;padding:3px 0 3px 12px}
.mkk::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--c)}
.mkk:first-child::before{top:50%}.mkk:last-child::before{bottom:50%}.mkk:only-child::before{display:none}
.mkk::after{content:"";position:absolute;left:0;top:50%;width:12px;border-top:1.5px solid var(--c)}
.mx.v0{background:var(--c);color:#fff;font-size:.86rem}.mx.v1{border:1.5px solid var(--c);background:#fff;color:var(--ink)}
.mx.v2{border:1px solid var(--c);background:#fff;color:var(--ink);font-weight:700}
.mx.vl{background:none;border-bottom:1.5px solid var(--c);border-radius:0;font-weight:500;padding:3px 4px;color:var(--ink)}
.mx.reading{background:#fef08a!important;color:var(--ink)!important}
.mimg{background:#fff;border-radius:1.4rem;box-shadow:var(--shadow);overflow:auto;-webkit-overflow-scrolling:touch;max-height:70dvh}
.mimg img{display:block}
@media (min-width:900px){.wrap,.nav nav{max-width:44rem}}
</style>

<body>
<main class="wrap" id="view"></main>
<div class="nav"><nav id="nav"></nav></div>
<div class="player" id="player" hidden><div><span id="plText">읽는 중…</span><button id="plStop">⏹ 멈춤</button></div></div>
<script src="qs.js"></script>
<script>
"use strict";
/* =========================================================
   프로그래밍기능사 공부 — 모든 기록은 이 기기(localStorage)에만
   ========================================================= */
const KEY = "prog.v1";
const PSUB = { P: "프로그래밍 언어", A: "응용SW기초기술", S: "SQL 활용", I: "정보시스템" };
const PSUB_PART = { P: 1, A: 2, S: 3, I: 4 };            // 정리서 PART A 과목 위치
const SG = { C: "C언어", J: "Java", Y: "Python", Q: "SQL", T: "테스트·서술형" };
const SG_PART = { C: 9, J: 9, Y: 9, Q: 8, T: 6 };     // 정리서 PART B 위치
const ROAD = { p: [1, 3, 2, 4], s: [9, 5, 8, 6, 7] };   // 추천 공부 순서 (PART 번호)
const def = () => ({ mode: "p", q: {}, sg: {}, star: [], cards: {}, done: {}, day: { d: "", n: 0 }, set: { examP: "", examS: "", goal: 20, rate: 1, voice: "" }, mocks: [], my: [] });
let S = def();
try { const raw = localStorage.getItem(KEY); if (raw) { S = Object.assign(def(), JSON.parse(raw)); S.set = Object.assign(def().set, S.set); } } catch {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("저장 공간이 꽉 찼어요"); } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const WQ = window.WQ, SQ = window.SQ, WBY = Object.fromEntries(WQ.map(q => [q.id, q])), SBY = Object.fromEntries(SQ.map(q => [q.id, q]));
function toast(t) { document.querySelector(".toast")?.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
function modal(title, html, mount) {
  const w = document.createElement("div"); w.className = "modal";
  w.innerHTML = `<div class="sheet"><div class="sheet-head"><h3>${esc(title)}</h3><button class="x" aria-label="닫기">×</button></div><div class="sbody">${html}</div></div>`;
  const close = () => { w.remove(); w.onclose?.(); };
  w.addEventListener("click", e => { if (e.target === w || e.target.closest(".x")) close(); });
  document.body.appendChild(w); mount?.(w, close); return w;
}
/* 교재는 크기가 커서 필요할 때만 불러와요 */
let bookP = null;
const loadBook = () => bookP || (bookP = new Promise((ok, no) => { if (window.BOOK) return ok(window.BOOK); const s = document.createElement("script"); s.src = "book.js"; s.onload = () => ok(window.BOOK); s.onerror = () => { bookP = null; no(); }; document.head.appendChild(s); }));

/* ---------- 코드 색칠 ---------- */

function hl(code) {

    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;

  const map = (n, p, lv, col) => { const has = !!(n.c && n.c.length), o = mmOpen.has(p) || p === "r";

    if (!has || !o) return box;
    return `<div class="mb">${box}<span class="mhl"></span><div class="mks">${n.c.map((c, i) => { const cc = p === "r" ? MCOL[i % MCOL.length] : col;
      return `<div class="mkk" style="--c:${cc}">${map(c, `${p}.${i}`, p === "r" ? 0 : lv + 1, cc)}</div>`; }).join("")}</div></div>`; };

    : mmMode === "map" ? `<p class="sm" style="text-align:center;margin:0">옆으로 밀어서 보기 · ▸ 가지를 누르면 펼쳐져요</p><div class="mmap" style="--c:#6b7280">${map(s, "r", 0)}</div>`

  <div class="tabs3">${[["list", "📋 목록"], ["map", "🗺 가지 지도"], ["img", "🖼 원본"]].map(([k, l]) => `<button class="${mmMode === k ? "on" : ""}" data-m="${k}">${l}</button>`).join("")}</div>

}
